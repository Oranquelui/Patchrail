[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchrail"
version = "0.2.0a1"
description = "Local-first verification and approval packets for AI coding agent work"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Patchrail" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-coding", "verification", "approval", "coding-agents", "cli"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Oranquelui/Patchrail"
Documentation = "https://github.com/Oranquelui/Patchrail#readme"

[project.optional-dependencies]
langgraph = ["langgraph"]

[project.scripts]
patchrail = "patchrail.cli.main:run"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["patchrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
